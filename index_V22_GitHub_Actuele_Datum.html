<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Baanindeling TV</title>
  <!-- V22 wrapper: actuele Apps Script versie + cache-buster -->
  <style>
    :root {
      /* In de iframe-weergave verschijnt de Google-balk niet; geen crop zodat de titel volledig zichtbaar blijft. */
      --google-banner-crop: 0px;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f5a2c;
    }
    .screen {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0f5a2c;
    }
    iframe {
      position: absolute;
      left: 0;
      top: calc(-1 * var(--google-banner-crop));
      width: 100%;
      height: calc(100% + var(--google-banner-crop));
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #edf4ef;
    }
  </style>
</head>
<body>
  <div class="screen">
    <iframe
      id="baanFrame"
      allow="fullscreen"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbzv60NFk55k1lk32nOC0kZUEfVARaQABxJjgVpXY6lVGPycE2U3vFcB42PpXieaU16_/exec';

    function loadCurrentVersion() {
      const frame = document.getElementById('baanFrame');
      frame.src = APP_URL + '?tv=1&cb=' + Date.now();
    }

    // Meteen de actuele versie laden.
    loadCurrentVersion();

    // Iedere 5 minuten de volledige iframe verversen om oude browsercache uit te sluiten.
    setInterval(loadCurrentVersion, 5 * 60 * 1000);
  </script>
</body>
</html>
